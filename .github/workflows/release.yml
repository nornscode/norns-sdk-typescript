name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

# Publishes with npm trusted publishing (OIDC): no token, provenance for
# free. Configure it once on npmjs.com under the package's settings:
# GitHub Actions, repo nornscode/norns-sdk-typescript, workflow release.yml,
# environment release.
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Trusted publishing needs npm 11.5+, newer than Node 22 bundles.
      - run: npm install -g npm@latest
      - name: Publish unless this version is already on npm
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "norns-sdk@$version" version >/dev/null 2>&1; then
            echo "norns-sdk@$version is already published; nothing to do"
          else
            npm publish --access public
          fi
